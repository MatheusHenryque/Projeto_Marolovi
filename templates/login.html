<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/login.css">
    <link rel="stylesheet" href="static/css/oftsys-cadastro-paciente.css">
    <title>OFTSYS</title>
</head>
<body>
    <div class="container">
        <div class="containerCadastro">
            <div class="containerPropaganda">
                <img class="imagemlogin" src="static\img\retina-scans-security-technology-double-color-exposure-effect.jpg" alt="Imagem Login">
            </div>
            <div class="containerForm">
                <div class="logoContainer">
                    <span><span>OFTSYS</span></span>
                    <label>A nova era do cuidado ocular começa com a IA.</label>
                </div>
                <div class="formInputs">
                    <form>
                        <div class="inputContainer">
                            <input type="text" id="inpUsuario" class="inpDadosUsuario" required>
                            <label>CRM</label>
                        </div>
                        <div class="inputContainer">
                            <input type="password" id="inpSenha" class="inpDadosUsuario" required>
                            <label>Senha</label>
                        </div>
                        <br>
                        <a href="/dashboard">
                            <button type="button" class="btnEntrar">Entrar</button>
                        </a>

                        <button type="button" class="esqueci" style="border: 0;" id="forgotPasswordBtn" >Esqueci minha senha</button>
                        
                        <div class="field consent-field">
                                    <label>
                                        <input type="checkbox" name="consentimento" id="consentimento" required />
                                            Declaro que li e concordo com a utilização das imagens de topografia corneana 
                                            para fins de análise clínica, desenvolvimento e aprimoramento do sistema, 
                                            em conformidade com a legislação vigente (LGPD).
                                    </label> 
                        </div>

                    </form>
                </div>  
            </div>
        </div>
        <div id="passwordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Recuperar Senha</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="success-message" id="successMessage">
                    ✓ Instruções de recuperação enviadas com sucesso!
                </div>
                <p>Insira seu CRM e e-mail cadastrados. Enviaremos instruções para redefinir sua senha.</p>
                <form id="recoveryForm">
                    <div class="modal-input-container">
                        <input type="text" id="modalCRM" required>
                        <label>CRM</label>
                    </div>
                    <div class="modal-input-container">
                        <input type="email" id="modalEmail" required>
                        <label>E-mail</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal btn-cancel" id="cancelBtn">Cancelar</button>
                <button type="button" class="btn-modal btn-submit" id="submitBtn">Enviar</button>
            </div>

        </div>
    </div>
    </div>
</body>

<script>
    document.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
            console.log("Entrar no sistema");
            window.location.href = "/admin";
        }
    });
</script>
 <script>
        document.addEventListener("keydown", event => {
            if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
                console.log("Entrar no sistema");
                window.location.href = "/admin";
            }
        });

        // Controle do Modal
        const modal = document.getElementById('passwordModal');
        const forgotBtn = document.getElementById('forgotPasswordBtn');
        const closeBtn = document.querySelector('.close');
        const cancelBtn = document.getElementById('cancelBtn');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const recoveryForm = document.getElementById('recoveryForm');

        // Abrir modal
        forgotBtn.onclick = function() {
            modal.style.display = 'block';
            successMessage.style.display = 'none';
            recoveryForm.reset();
        }

        // Fechar modal
        closeBtn.onclick = function() {
            modal.style.display = 'none';
        }

        cancelBtn.onclick = function() {
            modal.style.display = 'none';
        }

        // Fechar ao clicar fora do modal
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Enviar formulário
        submitBtn.onclick = function() {
            const crm = document.getElementById('modalCRM').value;
            const email = document.getElementById('modalEmail').value;

            if (crm && email) {
                successMessage.style.display = 'block';
                recoveryForm.reset();
                
                // Fechar modal após 2 segundos
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 2000);
                
                console.log('Recuperação solicitada:', { crm, email });
            } else {
                alert('Por favor, preencha todos os campos.');
            }
        }

        // Fechar modal com tecla ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && modal.style.display === 'block') {
                modal.style.display = 'none';
            }
        });
    </script>
</html>
