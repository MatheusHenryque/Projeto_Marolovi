<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuário</title>
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <div class="container">
        <div class="containerCadastro">
            <div class="containerPropaganda">
                <img class="imagemlogin" src="static\img\retina-scans-security-technology-double-color-exposure-effect.jpg" alt="Imagem Login">
            </div>
            <div class="containerForm">
                <div class="logoContainer">
                    <span><span>OFTSYS</span></span>
                    <label>A nova era do cuidado ocular começa com a IA.</label>
                </div>
                <div class="formInputs">
                    <form>
                        <div class="inputContainer">
                            <input type="text" id="inpNome" class="inpDadosUsuario" required>
                            <label>Nome Completo</label>
                        </div>
                        <div class="inputContainer">
                            <input type="text" id="inpCRM" class="inpDadosUsuario" required>
                            <label>CRM</label>
                        </div>
                        <div class="inputContainer">
                            <input type="email" id="inpEmail" class="inpDadosUsuario" required>
                            <label>Email</label>
                        </div></div>
                        <br>
                        <a href="/login">
                            <button type="button" class="btnEntrar">Cadastrar</button>
                        </a>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
