<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Médico</title>
    <link rel="stylesheet" href="static/css/admin.css">
</head>
<body>
    
    <div class="container">
        <div class="image-section"></div>
        
        <div class="form-section">
            <div class="form-header">
                <div class="form-subtitle">Cadastro de Médico</div>
                <h1 class="form-title">OFTSYS</h1>
                <p class="form-description">A nova era do cuidado ocular começa com a IA.</p>
            </div>

            <form>
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="crm">CRM</label>
                        <input type="text" id="crm" required>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">E-mail Corporativo</label>
                    <input type="email" id="email" required>
                </div>

                <a href="/login" class="btn-submit" style="min-width: 100%;">  
                    Cadastrar 
                </a>
            </form>
        </div>
    </div>
</body>
</html>
